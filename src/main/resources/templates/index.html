<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
          crossorigin="anonymous">
	<link rel="stylesheet" href="../static/css/index.css" th:href="@{/css/index.css}"/>

    <title>NBA Side App</title>

<body class="bg-primary">
	<header class="container">
		<h3 id="header">
			<a href="index.html" th:href="@{/logo}" class="home-icon">
				<img  style="width:50px; height:50px;" src="/static/images/home.svg" th:src="@{/images/home.svg}" alt="icon" width="2%"/>
			</a>
			Novel Basketball
		</h3>
	</header>
	
	<main class="container border" style="height:90vh">
		<div class="row m-5">

			<div class="card mx-auto p-0 bg-primary" style="width: 18rem;">
				<img src="/static/images/team.svg" th:src="@{/images/team.svg}" class="card-img-top mx-auto my-4" alt="icon" style="width:100px; height:100px">
				<div class="card-body bg-light border-top">
					<a href="draft_options.html" th:href="@{/draft_options}">
						<h5 class="card-title btn btn-primary" style="width:100%">Fantasy Team</h5>
					</a>
<!--					<a href="draft_options.html" th:href="@{/draft_options}" class="btn btn-primary" style="width:100%">select</a>-->
				</div>
			</div>

				<img src="/static/images/playoffs.svg" th:src="@{/images/playoffs.svg}" class="card-img-top mx-auto my-4" alt="icon" style="width:100px; height:100px">
				<div class="card-body bg-light border-top">
					<a href="playoffs_options.html" th:href="@{/playoffs_options}">
						<h5 class="card-title btn btn-primary" style="width:100%">Playoffs Bracket</h5>
					</a>
<!--					<a href="playoffs_options.html" th:href="@{/playoffs_options}" class="btn btn-primary" style="width:100%">select</a>-->
				</div>
			</div>

			<div class="card mx-auto p-0 bg-primary" style="width: 18rem;">
				<img src="/static/images/player.svg" th:src="@{/images/player.svg}" class="card-img-top mx-auto my-4" alt="icon" style="width:100px; height:100px">
				<div class="card-body bg-light border-top">
					<a href="random_team_options.html" th:href="@{/random_team_options}">
						<h5 class="card-title btn btn-primary" style="width:100%">Random Team</h5>
					</a>
				</div>
			</div>

<!--			<div class="card mx-auto p-0 bg-primary" style="width: 18rem;">-->
<!--				<img src="/static/images/player.svg" th:src="@{/images/player.svg}" class="card-img-top mx-auto my-4" alt="icon" style="width:100px; height:100px">-->

<!--			</div>-->
