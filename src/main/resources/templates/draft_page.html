<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
		  crossorigin="anonymous">
	<link rel="stylesheet" href="../static/css/index.css" th:href="@{/css/index.css}"/>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
	</script>
	<title>Team Draft</title>
</head>
<body class="bg-primary">
<header class="container">
	<h3 id="header">
		<a href="index.html" th:href="@{/logo}" class="home-icon">
			<img  style="width:50px; height:50px;" src="/static/images/home.svg" th:src="@{/images/home.svg}" alt="icon" width="2%"/>
		</a>
		Novel Basketball
	</h3>
</header>

<main class="container border" style="height:90vh">
	<div class="row" style="height:100%">
		<div class="container border col-2">
			<div id="team-roster" class="container row p-0">
				<div>
					<b>Team #<span th:text="${team.teamName}">#</span></b>
				</div>
				<div class="pe-0" th:each="player : ${team.roster}">
					<div class="roster-row border">
						<span th:text="${player.fullName}">name</span>
<!--							<span th:text="${player.overall}">##</span>-->
					</div>
				</div>
			</div>
		</div>
		
		<div id="draft-pool" class="container border col-10 table-responsive p-0" style="height:100%">
			<table class="table table-bordered table-fixed">
				<thead class="table-dark sticky-top">
					<tr>
						<th class="px-0" scope="col" style="width: 75px;"></th>
						<th scope="col">NAME</th>
						<th scope="col" style="width: 80px;">POS</th>
						<th scope="col" style="width: 50px;">LAY</th>
						<th scope="col" style="width: 50px;">DNK</th>
						<th scope="col" style="width: 50px;">INS</th>
						
						<th scope="col" style="width: 50px;">MID</th>
						<th scope="col" style="width: 50px;">3PT</th>
						<th scope="col" style="width: 50px;">FT</th>
						
						<th scope="col" style="width: 50px;">DRB</th>
						<th scope="col" style="width: 50px;">PAS</th>
						<th scope="col" style="width: 50px;">ORE</th>

						<th scope="col" style="width: 50px;">DRE</th>
						<th scope="col" style="width: 50px;">STL</th>
						<th scope="col" style="width: 50px;">BLK</th>
						<th scope="col" style="width: 50px;">OVR</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="player : ${players}" th:unless="${player.drafted}">
						<td class="p-0">
							<form method="post" action="draft_summary.html" th:action="@{/draft_page/draft_player}">
								<input type="hidden" name="playerId" th:value="${player.playerId}">
								<input type="image" src="/static/images/players/0-Michael_Jordan.png" th:src="@{'/images/players/' + ${player.image} + '.png'}"
									   alt="icon" height="72px">
							</form>
						</td>
						<td class="fw-bold" th:text="${player.fullName}">Michael Jordan</td>
						<td class="fw-bold" th:text="${player.positions}">SG, SF</td>
						
						<td class="fw-bold" th:text="${player.layup}">10</td>
						<td class="fw-bold" th:text="${player.dunk}">10</td>
						<td class="fw-bold" th:text="${player.insideScoring}">9</td>
						
						<td class="fw-bold" th:text="${player.midRangeScoring}">10</td>
						<td class="fw-bold" th:text="${player.threePointScoring}">6.5</td>
						<td class="fw-bold" th:text="${player.freeThrow}">10</td>
						
						<td class="fw-bold" th:text="${player.dribbling}">9</td>
						<td class="fw-bold" th:text="${player.passing}">7</td>
						<td class="fw-bold" th:text="${player.offensiveRebounding}">5</td>
						
						<td class="fw-bold" th:text="${player.defensiveRebounding}">6</td>
						<td class="fw-bold" th:text="${player.steal}">10</td>
						<td class="fw-bold" th:text="${player.block}">6.5</td>

						<td class="fw-bold" th:text="${player.overall}">99</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
</body>
</html>
