<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
		  crossorigin="anonymous">
	<link rel="stylesheet" href="../static/css/index.css" th:href="@{/css/index.css}"/>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
			integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
	</script>
	<title>playoffs options</title>
</head>
<body class="bg-primary">
<header class="container">
	<h3 id="header">
		<a href="index.html" th:href="@{/logo}" class="home-icon">
			<img  style="width:50px; height:50px;" src="/static/images/home.svg" th:src="@{/images/home.svg}" alt="icon" width="2%"/>
		</a>
		Novel Basketball
	</h3>
</header>

<main class="container border" style="height:85vh">
	<div class="row mt-5 mx-5">
		<div class="card mx-auto p-0">
			<div class="card-body bg-light border-top">
				<h5 class="card-title mb-3">Select option</h5>
	
				<form class="container row bg-light" method="post" action="random_team.html" th:action="@{/random_team}">
					
					<div class="row">
						<div class="form-check">
							<input class="form-check-input" type="radio" name="league" id="nbaTeams" value="nba" checked>
							<label class="form-check-label" for="nbaTeams">
								NBA Teams
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="league" id="hoopLandTeams" value="hoop-land">
							<label class="form-check-label" for="hoopLandTeams">
								Hoop-Land Teams
							</label>
						</div>
					</div>
					
					<div class="row pt-3">
						<input class="btn btn-primary" type="submit" value="Generate" style="width:250px">
					</div>
				</form>
			</div>
		</div>
	</div>
</main>
</body>
</html>
