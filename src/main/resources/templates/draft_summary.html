<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
		  crossorigin="anonymous">
	<link rel="stylesheet" href="../static/css/index.css" th:href="@{/css/index.css}"/>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
	</script>
	<title>Team Draft Summary</title>
</head>
<body class="bg-primary">
	<header class="container">
		<h3 id="header">
			<a href="index.html" th:href="@{/logo}" class="home-icon">
				<img  style="width:50px; height:50px;" src="/static/images/home.svg" th:src="@{/images/home.svg}" alt="icon" width="2%"/>
			</a>
			Novel Basketball
		</h3>
	</header>
	
	<main class="container" style="height:90vh">
		<div class="row border" style="height:100%">
			<div class="container border col-2">
				<div id="team-roster" class="container row p-0" style="height:70%">
					<div>
						<h3>Lineup</h3>
						<span th:text="${team.teamName}">##</span><br>
						<b>PG</b> <span th:text="${team.insideScoring}">##</span><br>
						<b>SG</b> <span th:text="${team.midRangeScoring}">##</span><br>
						<b>SF</b> <span th:text="${team.threePointScoring}">##</span><br>
						<b>PF</b> <span th:text="${team.playmaking}">##</span><br>
						<b>C</b> <span th:text="${team.rebounding}">##</span><br>
					</div>
				</div>
			</div>
			
			<div id="draft-pool" class="container border col-10 table-responsive p-0" style="height:100%">
				<div style="height:90%">
					<table class="table table-bordered table-fixed">
						<thead class="table-dark sticky-top">
							<tr>
								<th class="px-0" scope="col" style="width: 75px;"></th>
								<th scope="col">NAME</th>
								<th scope="col" style="width: 60px;">LAY</th>
								<th scope="col" style="width: 60px;">DNK</th>
								<th scope="col" style="width: 60px;">INS</th>
	
								<th scope="col" style="width: 60px;">MID</th>
								<th scope="col" style="width: 60px;">3PT</th>
								<th scope="col" style="width: 60px;">FT</th>
	
								<th scope="col" style="width: 60px;">DRB</th>
								<th scope="col" style="width: 60px;">PAS</th>
								<th scope="col" style="width: 60px;">ORE</th>
	
								<th scope="col" style="width: 60px;">DRE</th>
								<th scope="col" style="width: 60px;">STL</th>
								<th scope="col" style="width: 60px;">BLK</th>
							</tr>
						</thead>
						<tbody th:each="player : ${team.roster}">
						<tr>
							<td class="p-0">
								<img src="/static/images/players/0-Michael_Jordan.png" th:src="@{'/images/players/' + ${player.image} + '.png'}"
									   alt="icon" height="72px">
							</td>
							<td class="fw-bold" th:text="${player.fullName}">Michael Jordan</td>

							<td class="fw-bold" th:text="${player.layup}">10</td>
							<td class="fw-bold" th:text="${player.dunk}">10</td>
							<td class="fw-bold" th:text="${player.insideScoring}">9</td>

							<td class="fw-bold" th:text="${player.midRangeScoring}">10</td>
							<td class="fw-bold" th:text="${player.threePointScoring}">6.5</td>
							<td class="fw-bold" th:text="${player.freeThrow}">10</td>

							<td class="fw-bold" th:text="${player.dribbling}">9</td>
							<td class="fw-bold" th:text="${player.passing}">7</td>
							<td class="fw-bold" th:text="${player.offensiveRebounding}">5</td>

							<td class="fw-bold" th:text="${player.defensiveRebounding}">6</td>
							<td class="fw-bold" th:text="${player.steal}">10</td>
							<td class="fw-bold" th:text="${player.block}">6.5</td>
						</tr>
						</tbody>
					</table>
				</div>
				
				<div class="border border-danger pt-2">
					<nav>
						<ul class="pagination d-flex justify-content-evenly overflow-auto">
							<li  th:each="i : ${#numbers.sequence(1, leagueSize)}">
								
								<form method="post" action="#" th:action="@{/draft_summary/team}">
									<input class="page-link" type="submit" value="#" 
										   name="teamIndex" th:value="${i}">
								</form>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
